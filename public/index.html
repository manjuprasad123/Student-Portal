<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Portal</title>

  <link rel="stylesheet" href="/style.css" />

</head>

<body>
  <div class="container">
    <h1>Student Portal</h1>
    <p class="subtitle">Manage students and their course selection</p>

    <button id="loadStudents">
      Load Students
    </button>

    <div class="list-header">
      <h2>Students</h2>
      <span id="studentCount">0</span>
    </div>

  <div id="studentList">

  </div>

    <div id="studentList">

    </div>

    <h2>Add New Student</h2>

    <form id="studentsForm">

      <input
          type="text"
          id="name"
          placeholder="Student Name"
      >

      <input
          type="text"
          id="course"
          placeholder="Course"
      >

      <input
          type="number"
          id="age"
          placeholder="Age"
      >

      <button type="submit">
          Add Student
      </button>
    </form>

  </div>

  <script src="/script.js"></script>
</body>

</html>
